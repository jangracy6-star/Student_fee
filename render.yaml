# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: student-fee-reminders
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INSTITUTION_NAME
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
